services:

  # ========================================================
  # STORAGE HELPER (Automated Directory & Permissions Guard)
  # ========================================================
  storage-init:
    image: alpine:latest
    container_name: observability_storage_init
    user: "0:0"
    restart: unless-stopped
    network_mode: none
    volumes:
      - ${DATA_DIR:-/home/mgrsys/DATA}/observability/data:/data
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        echo ">>> [Storage Init] Setting up directories and permissions..."
        mkdir -p /data/beszel /data/uptime-kuma /data/homepage/logs
        chmod -R 775 /data
        echo ">>> [Storage Init] Permissions applied. Storage guard active."
        sleep infinity

  # ========================================================
  # HOMEPAGE (Unified Homelab Portal & Service Cockpit)
  # ========================================================
  homepage:
    image: ghcr.io/gethomepage/homepage:latest
    container_name: homepage
    restart: unless-stopped
    volumes:
      - ./config:/app/config
      - ${DATA_DIR:-/home/mgrsys/DATA}/observability/data/homepage/logs:/app/config/logs
      - /var/run/docker.sock:/var/run/docker.sock:ro
    environment:
      - TZ=${TZ:-UTC}
      - ROOT_DOMAIN=${ROOT_DOMAIN:-example.com}
      - HOMEPAGE_VAR_ROOT_DOMAIN=${ROOT_DOMAIN:-example.com}
      - HOMEPAGE_ALLOWED_HOSTS=homelab.${ROOT_DOMAIN:-example.com},hub.${ROOT_DOMAIN:-example.com},127.0.0.1,localhost
    networks:
      - shared_net
      - homelab_swarm_net
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ========================================================
  # BESZEL HUB (Telemetry, Bandwidth & Resource Metrics)
  # ========================================================
  beszel:
    image: henrygd/beszel:latest
    container_name: beszel
    restart: unless-stopped
    ports:
      - "8090:8090"
    volumes:
      - ${DATA_DIR:-/home/mgrsys/DATA}/observability/data/beszel:/beszel_data
    environment:
      - PORT=8090
    networks:
      - shared_net
      - homelab_swarm_net
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ========================================================
  # BESZEL AGENT (Collector on VM1: zap-vps)
  # ========================================================
  beszel-agent:
    image: henrygd/beszel-agent:latest
    container_name: beszel_agent
    restart: unless-stopped
    network_mode: host
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /:/extra-filesystems/root:ro
    environment:
      - PORT=45876
      - KEY=${BESZEL_PUBLIC_KEY:-}
    depends_on:
      - beszel
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ========================================================
  # DOZZLE HUB (Real-Time Container Log Viewer)
  # ========================================================
  dozzle:
    image: amir20/dozzle:latest
    container_name: dozzle
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    environment:
      - DOZZLE_REMOTE_AGENT=${DOZZLE_REMOTE_AGENT:-}
      - DOZZLE_LEVEL=info
    networks:
      - shared_net
      - homelab_swarm_net
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ========================================================
  # UPTIME KUMA (Multi-Node Health & Outage Alerting)
  # ========================================================
  uptime-kuma:
    image: louislam/uptime-kuma:1
    container_name: uptime_kuma
    restart: unless-stopped
    volumes:
      - ${DATA_DIR:-/home/mgrsys/DATA}/observability/data/uptime-kuma:/app/data
    networks:
      - shared_net
      - homelab_swarm_net
    healthcheck:
      test: ["CMD", "extra/healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

networks:
  homelab_swarm_net:
    name: homelab_swarm_net
    external: true
  shared_net:
    name: ${SHARED_NETWORK:-shared_net}
    external: true
