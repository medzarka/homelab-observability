services:

  # ========================================================
  # STORAGE HELPER (Automated Directory & Permissions Guard)
  # ========================================================
  storage-init:
    image: alpine:latest
    container_name: worker_storage_init
    user: "0:0"
    restart: unless-stopped
    network_mode: none
    volumes:
      - ${DATA_DIR:-/home/${SYSTEM_USER:-ubuntu}/DATA/var/observability}:/data
    entrypoint: [ "/bin/sh", "-c" ]
    command:
      - |
        echo ">>> [Storage Init] Setting up worker directories and permissions..."
        mkdir -p /data/beszel-agent
        chmod -R 775 /data
        echo ">>> [Storage Init] Permissions applied. Storage guard active."
        sleep infinity

  # ========================================================
  # BESZEL AGENT (Host Telemetry & Hardware Metrics Daemon)
  # ========================================================
  beszel-agent:
    image: henrygd/beszel-agent:latest
    container_name: beszel_agent_${DOCKER_NODE_ID:-worker}
    restart: unless-stopped
    networks:
      - homelab_swarm_net
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ${DATA_DIR:-/home/${SYSTEM_USER:-ubuntu}/DATA/var/observability}/beszel-agent:/var/lib/beszel-agent
      - /:/extra-filesystems/root:ro
    environment:
      - LISTEN=${BESZEL_AGENT_PORT:-45876}
      - PORT=${BESZEL_AGENT_PORT:-45876}
      - KEY=${BESZEL_PUBLIC_KEY:-}
      - TOKEN=${BESZEL_TOKEN:-}
      - HUB_URL=${BESZEL_HUB_URL:-}
    depends_on:
      - storage-init
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ========================================================
  # DOZZLE AGENT (Remote Multi-Node Container Log Streamer)
  # ========================================================
  dozzle-agent:
    image: amir20/dozzle:latest
    container_name: dozzle_agent_${DOCKER_NODE_ID:-worker}
    restart: unless-stopped
    command: agent
    networks:
      - homelab_swarm_net
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    environment:
      - DOZZLE_LEVEL=info
      - DOZZLE_NO_ANALYTICS=true
      - DOZZLE_HOSTNAME=${NODE_NAME:-worker}
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: [ "CMD", "/dozzle", "healthcheck" ]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s

networks:
  shared_net:
    name: ${SHARED_NETWORK:-shared_net}
    external: true
  homelab_swarm_net:
    name: ${SWARM_NETWORK:-homelab_swarm_net}
    external: true
